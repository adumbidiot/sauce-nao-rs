[package]
name = "sauce-nao-cli"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
dirs-next = "2.0.0"
reqwest = { version = "0.13.5", default-features = false }
sauce-nao = { path = "../sauce-nao" }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [ "rt-multi-thread" ] }
toml = "1.1.8"
