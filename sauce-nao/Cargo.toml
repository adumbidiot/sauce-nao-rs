[package]
name = "sauce-nao"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
itoa = "1.0.18"
reqwest = { version = "0.13.5", default-features = false, features = [ "json", "stream", "multipart" ] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [ "fs" ] }
tokio-util = { version = "0.7.20", features = [ "codec" ] }
url = { version = "2.5.8", features = [ "serde" ] }

[dev-dependencies]
tokio = { version = "1.54.1", features = [ "macros" ] }

[features]
default = [ "rustls" ]

native-tls = [ "reqwest/native-tls" ]
rustls = [ "reqwest/rustls" ]
